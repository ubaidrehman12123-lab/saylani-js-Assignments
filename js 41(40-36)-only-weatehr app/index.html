<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>



    <div class="container w-100 h-100">
        <h1 class="fw-bold font-monospace ">
            Weather App
        </h1>

        <div class="userInput">
            <input class="p-1" id="input" type="text" placeholder="Enter City name">
            <BUtton id="btn" class="bg-primary fw-bold text-white p-2 rounded-3 border-0">Search</BUtton>
        </div>


        <div class="parntDiv">

            <div class="info-box">
                <h3>City</h3>
                <p id="city">--</p>
            </div>

            <div class="info-box">
                <h3>Country</h3>
                <p id="country">--</p>
            </div>

            <div class="info-box">
                <h3>Latitude</h3>
                <p id="latitude">--</p>
            </div>

            <div class="info-box">
                <h3>Longitude</h3>
                <p id="longitude">--</p>
            </div>

        </div>
        <span class="span"></span>
    </div>


</body>
<script src="script.js"></script>
